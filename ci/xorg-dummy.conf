# Xorg بدون شاشة: driver وهمي مع modeline صريح (60Hz) ليرى LWJGL 2 أوضاع عرض صالحة.
Section "ServerFlags"
  Option "AutoAddDevices" "false"
  Option "AutoEnableDevices" "false"
  Option "DontVTSwitch" "true"
EndSection

Section "Device"
  Identifier "dummy0"
  Driver "dummy"
  VideoRam 256000
EndSection

Section "Monitor"
  Identifier "mon0"
  HorizSync 5.0 - 1000.0
  VertRefresh 5.0 - 200.0
  Modeline "1280x720_60.00" 74.50 1280 1344 1472 1664 720 723 728 748 -hsync +vsync
EndSection

Section "Screen"
  Identifier "scr0"
  Device "dummy0"
  Monitor "mon0"
  DefaultDepth 24
  SubSection "Display"
    Viewport 0 0
    Depth 24
    Modes "1280x720_60.00"
    Virtual 1280 720
  EndSubSection
EndSection

Section "ServerLayout"
  Identifier "layout0"
  Screen "scr0"
EndSection
