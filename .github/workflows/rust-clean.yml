name: rust-clean
# Compiles and tests the Horizon Rust Clean branch. The upstream release workflows (launcher.yml, game.yml) stay as they were
# and are not triggered by this branch.
on:
  push:
    branches: [rust-clean]
    paths-ignore: ['docs/**', '**.md']
  workflow_dispatch:

permissions:
  contents: read

env:
  HORIZON_TELEMETRY_URL: "off"
  CARGO_TERM_COLOR: never

jobs:
  launcher-check:
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    defaults:
      run:
        working-directory: launcher
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: launcher
      - run: bash "$GITHUB_WORKSPACE/tools/ci/apt_install.sh" libxkbcommon-x11-dev libwayland-dev libx11-xcb-dev libfontconfig-dev libvulkan-dev libasound2-dev
      - run: cargo check --locked
      - name: Theme tests (palettes, contrast, Clean theme)
        run: cargo test --locked theme

  game-check:
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: bash "$GITHUB_WORKSPACE/tools/ci/apt_install.sh" libasound2-dev libudev-dev
      - name: Check the game crate
        run: cargo check --locked -p horizon-client
      - name: Unit tests of the HUD / extras logic
        run: cargo test --locked -p horizon-client-render --lib -- extras pvp zoom options_ui

  # Rapports separados por sistema: cargo check NO prueba que el juego arranque; solo que compila.
  game-check-os:
    name: game-check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --locked -p horizon-client

  game-lib-tests:
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: bash "$GITHUB_WORKSPACE/tools/ci/apt_install.sh" libasound2-dev libudev-dev
      - name: All unit tests of horizon-client-render and horizon-theme
        run: cargo test --locked -p horizon-client-render -p horizon-theme --lib

  # Informativo: el error actual está en audio.rs de upstream (unreachable-code con el stable más nuevo), no en este branch.
  game-clippy:
    continue-on-error: true
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: bash "$GITHUB_WORKSPACE/tools/ci/apt_install.sh" libasound2-dev libudev-dev
      - name: Clippy (warnings are errors) on the crate this branch changes
        run: cargo clippy --locked -p horizon-client-render --lib -- -D warnings

  # Informativo: varios tests de tests/ son del proceso de upstream (sus workflows/README) o necesitan los datos vanilla.
  python-tests:
    continue-on-error: true
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Python unit tests (tests/)
        run: python3 -m unittest discover -s tests
