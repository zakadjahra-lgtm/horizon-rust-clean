name: Build & Test

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'وسم الإصدار لإنشاء Release (مثل v0.1.0). اتركه فارغاً لعدم الإنشاء'
        required: false
        default: ''

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Unit tests
        run: cargo test --workspace --exclude hrc-app --all-targets

  windows-exe:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build UI (TypeScript)
        working-directory: ui
        run: |
          npm install
          npm run build
      - name: Build Horizon Client (Java agent)
        run: mvn -B -q -f client/pom.xml package
      - name: Build app and CLI (release)
        run: cargo build --release -p hrc-app -p hrc-cli -p hrc-rustgame
      - name: Place agent next to the exe
        shell: pwsh
        run: Copy-Item client\target\horizon-client.jar target\release\horizon-client.jar
      - name: Build installer (Inno Setup)
        shell: pwsh
        run: |
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress; }
          & $iscc "/DAppExe=..\target\release\horizon-rust-clean.exe" "/DCliExe=..\target\release\hrc-cli.exe" "/DAgentJar=..\target\release\horizon-client.jar" "/DRustGame=..\target\release\horizon-rust-game.exe" installer\horizon.iss
          if ($LASTEXITCODE -ne 0) { exit 1 }
          Get-ChildItem installer\Output
      - name: Test installer (silent install, files, CLI, real network, real install)
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $dir = "C:\hrc-installed"
          Start-Process -FilePath "installer\Output\HorizonRustClean-Setup.exe" -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART","/DIR=$dir" -Wait
          foreach ($f in "horizon-rust-clean.exe","hrc-cli.exe","horizon-client.jar","horizon-rust-game.exe") {
            if (-not (Test-Path "$dir\$f")) { throw "MISSING after install: $f" }
            Write-Host "PASS installed $f ($((Get-Item "$dir\$f").Length) bytes)"
          }
          $env:HRC_DATA = "$env:RUNNER_TEMP\hrc-win"
          & "$dir\hrc-cli.exe" flags performance
          Write-Host "--- netcheck (Windows, native TLS roots) ---"
          & "$dir\hrc-cli.exe" netcheck
          Write-Host "netcheck exit: $LASTEXITCODE"
          Write-Host "--- real install on Windows: Fabric 1.20.1 ---"
          $env:HRC_LOADER = "fabric"
          & "$dir\hrc-cli.exe" install 1.20.1
          if ($LASTEXITCODE -ne 0) { throw "hrc-cli install failed on Windows" }
          Remove-Item Env:HRC_LOADER
          Write-Host "--- Horizon Rust game: real render on Windows (DX12/Vulkan, software adapter if no GPU) ---"
          & "$dir\horizon-rust-game.exe" --screenshot "$env:RUNNER_TEMP\rust.png" --size 640x360 --user Tester
          if ($LASTEXITCODE -ne 0) { throw "horizon-rust-game --screenshot failed on Windows" }
          $png = Get-Item "$env:RUNNER_TEMP\rust.png"
          if ($png.Length -lt 5000) { throw "rust screenshot too small: $($png.Length) bytes" }
          Write-Host "PASS Horizon Rust rendered a frame on Windows ($($png.Length) bytes)"
          Write-Host "--- GUI starts ---"
          $p = Start-Process -FilePath "$dir\horizon-rust-clean.exe" -PassThru
          Start-Sleep -Seconds 20
          $p.Refresh()
          if ($p.HasExited) { throw "GUI exited early with code $($p.ExitCode)" }
          Write-Host "PASS GUI process alive after 20s; window title: '$($p.MainWindowTitle)'"
          Stop-Process -Id $p.Id -Force
      - uses: actions/upload-artifact@v4
        with:
          name: hrc-cli-windows
          path: |
            target/release/horizon-rust-clean.exe
            target/release/hrc-cli.exe
            target/release/horizon-client.jar
            target/release/horizon-rust-game.exe
            installer/Output/HorizonRustClean-Setup.exe

  # تشغيل حقيقي للعبة تحت شاشة افتراضية مع Horizon Client، ثم لقطة شاشة تُرفع لفرع ci-shots-<version>
  game-smoke:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        version: ["1.8.9"]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: System packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends xvfb x11-utils imagemagick \
            libxxf86vm1 libxcursor1 libxrandr2 libxi6 libxext6 libgl1 libgl1-mesa-dri \
            libglu1-mesa libopenal1 libfontconfig1 libfreetype6 fonts-dejavu-core tigervnc-standalone-server xserver-xorg-core xserver-xorg-video-dummy x11-xserver-utils
      - name: Build Horizon Client (Java agent)
        run: mvn -B -q -f client/pom.xml package
      - name: Build CLI
        run: cargo build --release -p hrc-cli
      - name: Launch game under Xvfb
        run: ci/game-smoke.sh ${{ matrix.version }} 100
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: game-smoke-${{ matrix.version }}
          path: ci-out/
      - name: Publish screenshot and log to branch ci-shots-${{ matrix.version }}
        if: always()
        run: |
          git config --global user.name "ci"
          git config --global user.email "ci@users.noreply.github.com"
          d=$(mktemp -d)
          cp ci-out/* "$d"/ 2>/dev/null || true
          cd "$d"
          git init -q -b shots
          git add -A
          git commit -q -m "shots ${{ matrix.version }} ${{ github.sha }}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" shots:refs/heads/ci-shots-${{ matrix.version }}

  release:
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.release_tag != '')
    needs: [windows-exe, install-smoke, launch-smoke, isolation-smoke, loader-smoke, mods-smoke]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: hrc-cli-windows
      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.release_tag || github.ref_name }}
        run: |
          gh release create "$TAG" "$(find . -name HorizonRustClean-Setup.exe | head -1)" "$(find . -name horizon-rust-clean.exe | head -1)" "$(find . -name hrc-cli.exe | head -1)" "$(find . -name horizon-rust-game.exe | head -1)" CHANGELOG.md STATUS.md \
            --repo "${{ github.repository }}" \
            --title "Horizon Rust Clean $TAG (test build)" \
            --prerelease \
            --notes-file RELEASE_NOTES.md

  # تثبيت فعلي لكل نوع بيئة (Fabric/Quilt/Forge/NeoForge/Horizon) من الخوادم الرسمية
  loader-smoke:
    needs: test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { loader: fabric, version: "1.20.1" }
          - { loader: quilt, version: "1.20.1" }
          - { loader: forge, version: "1.20.1" }
          - { loader: forge, version: "1.12.2" }
          - { loader: neoforge, version: "1.21.1" }
          - { loader: horizon, version: "1.20.1" }
          - { loader: horizon, version: "1.8.9" }
          - { loader: rusttools, version: "1.20.1" }
          - { loader: rusttools, version: "26.3" }
          - { loader: fabric, version: "1.18" }
          - { loader: fabric, version: "1.16.5" }
          - { loader: fabric, version: "1.21.1" }
          - { loader: fabric, version: "26.3" }
          - { loader: quilt, version: "1.21.1" }
          - { loader: quilt, version: "1.18.2" }
          - { loader: forge, version: "1.16.5" }
          - { loader: forge, version: "1.18.2" }
          - { loader: forge, version: "1.21.1" }
          - { loader: forge, version: "26.3" }
          - { loader: neoforge, version: "1.20.4" }
          - { loader: neoforge, version: "26.3" }
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release -p hrc-cli
      - name: Install ${{ matrix.loader }} ${{ matrix.version }}
        env:
          HRC_DATA: ${{ runner.temp }}/hrc
          HRC_LOADER: ${{ matrix.loader }}
        run: |
          ./target/release/hrc-cli install ${{ matrix.version }} 2>&1 | tee out.txt
          grep -E "^Installed .* launch id " out.txt
          ID=$(grep -E "^Installed .* launch id " out.txt | sed -E 's/.*launch id ([^ ]+) .*/\1/' | tail -1)
          echo "launch id: $ID"
          test -f "$HRC_DATA/shared/versions/$ID/$ID.json"
          ls "$HRC_DATA"/instances/*/game

  # اختبار حقيقي: تثبيت الإصدار وبناء أمر التشغيل (بدون تشغيل اللعبة لأن السيرفر بلا شاشة)
  install-smoke:
    needs: test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        version: ["1.8.9", "1.12.2", "1.16.5", "1.20.1"]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo run --release -p hrc-cli -- install ${{ matrix.version }}

  # مدير المودات الحقيقي: تنزيل من Modrinth مع SHA1 والتبعيات، لبيئات مختلفة
  mods-smoke:
    needs: test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { loader: fabric, mc: "1.20.1", mod: sodium }
          - { loader: fabric, mc: "1.20.1", mod: lithium }
          - { loader: quilt, mc: "1.20.1", mod: lithium }
          - { loader: horizon, mc: "1.20.1", mod: ferrite-core }
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release -p hrc-cli
      - name: Install ${{ matrix.mod }} for ${{ matrix.loader }} ${{ matrix.mc }}
        env:
          HRC_LOADER: ${{ matrix.loader }}
        run: |
          out=$(target/release/hrc-cli mod ${{ matrix.mc }} ${{ matrix.mod }})
          echo "$out"
          echo "$out" | grep -q "\.jar" || { echo "no jar installed"; exit 1; }

  # تشغيل Minecraft فعلياً (نافذة + بقاء العملية حيّة + لقطة) لكل loader وإصدار، مع Java Runtime تلقائي
  launch-smoke:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - { loader: vanilla, version: "1.8.9" }
          - { loader: vanilla, version: "1.12.2" }
          - { loader: vanilla, version: "1.16.5" }
          - { loader: vanilla, version: "1.20.1" }
          - { loader: vanilla, version: "1.21.1" }
          - { loader: vanilla, version: "26.3" }
          - { loader: rusttools, version: "1.20.1" }
          - { loader: fabric, version: "1.20.1" }
          - { loader: fabric, version: "1.21.1" }
          - { loader: quilt, version: "1.20.1" }
          - { loader: forge, version: "1.12.2" }
          - { loader: forge, version: "1.16.5" }
          - { loader: forge, version: "1.20.1" }
          - { loader: neoforge, version: "1.21.1" }
          # مودات حقيقية من Modrinth داخل instance واحد، والـ instance الآخر على نفس الإصدار نظيف منها
          - { loader: fabric, version: "1.20.1", mod: lithium, absent: "" }
          - { loader: fabric, version: "1.20.1", mod: sodium, absent: "" }
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: System packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends xvfb x11-utils imagemagick \
            libxxf86vm1 libxcursor1 libxrandr2 libxi6 libxext6 libxrender1 libxtst6 libgl1 libgl1-mesa-dri libglx-mesa0 \
            libglu1-mesa libopenal1 libfontconfig1 libfreetype6 fonts-dejavu-core xserver-xorg-core xserver-xorg-video-dummy x11-xserver-utils
      - name: Build CLI
        run: cargo build --release -p hrc-cli
      - name: Launch ${{ matrix.loader }} ${{ matrix.version }}
        env:
          SMOKE_MOD: ${{ matrix.mod }}
          SMOKE_ABSENT: ${{ matrix.absent }}
        run: ci/launch-smoke.sh ${{ matrix.loader }} ${{ matrix.version }} 300
      - name: Publish screenshot and log to branch ci-shots-${{ matrix.loader }}-${{ matrix.version }}${{ matrix.mod && format('-{0}', matrix.mod) || '' }}${{ matrix.absent && '-clean' || '' }}
        if: always()
        run: |
          git config --global user.name "ci"
          git config --global user.email "ci@users.noreply.github.com"
          d=$(mktemp -d)
          cp ci-out/* "$d"/ 2>/dev/null || true
          cd "$d"
          git init -q -b shots
          git add -A
          git commit -q -m "shots ${{ matrix.loader }} ${{ matrix.version }} ${{ github.sha }}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" shots:refs/heads/ci-shots-${{ matrix.loader }}-${{ matrix.version }}${{ matrix.mod && format('-{0}', matrix.mod) || '' }}${{ matrix.absent && '-clean' || '' }}

  # عزل الـ instances: ثلاث بيئات على نفس إصدار Minecraft وفي نفس مجلد بيانات اللانشر، بمودات مختلفة
  isolation-smoke:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release -p hrc-cli
      - name: Install vanilla + Fabric + Quilt 1.20.1 side by side with different mods
        env:
          HRC_DATA: ${{ runner.temp }}/hrc-iso
        run: |
          set -e
          CLI=./target/release/hrc-cli
          $CLI install 1.20.1
          HRC_LOADER=fabric $CLI install 1.20.1
          HRC_LOADER=quilt  $CLI install 1.20.1
          HRC_LOADER=fabric $CLI mod 1.20.1 lithium
          HRC_LOADER=quilt  $CLI mod 1.20.1 ferrite-core
          I="$HRC_DATA/instances"
          ls -1 "$I"
          fail=0
          check() { if eval "$2"; then echo "PASS $1"; else echo "FAIL $1"; fail=1; fi; }
          check "three separate instance folders" '[ -d "$I/cli-1.20.1" ] && [ -d "$I/cli-fabric-1.20.1" ] && [ -d "$I/cli-quilt-1.20.1" ]'
          check "fabric has lithium"            'ls "$I/cli-fabric-1.20.1/game/mods" | grep -qi lithium'
          check "fabric has NO ferrite-core"    '! ls "$I/cli-fabric-1.20.1/game/mods" | grep -qi ferrite'
          check "quilt has ferrite-core"        'ls "$I/cli-quilt-1.20.1/game/mods" | grep -qi ferrite'
          check "quilt has NO lithium"          '! ls "$I/cli-quilt-1.20.1/game/mods" | grep -qi lithium'
          check "vanilla has no mods folder"    '[ ! -e "$I/cli-1.20.1/game/mods" ]'
          check "separate natives folders"      '[ -d "$I/cli-fabric-1.20.1/natives" ] && [ -d "$I/cli-quilt-1.20.1/natives" ] && [ -d "$I/cli-1.20.1/natives" ]'
          check "no jar shared between fabric and quilt instances" '[ -z "$(comm -12 <(cd "$I/cli-fabric-1.20.1/game/mods" && ls | sort) <(cd "$I/cli-quilt-1.20.1/game/mods" && ls | sort))" ]'
          check "loader versions live side by side in shared/versions" 'ls "$HRC_DATA/shared/versions" | grep -q fabric-loader && ls "$HRC_DATA/shared/versions" | grep -q quilt-loader'
          exit $fail

  # لعبة Rust الأصلية التجريبية: بناء + اختبارات + رسم حقيقي بدون نافذة عبر Vulkan البرمجي (lavapipe) + لقطة
  rustgame-smoke:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: System packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends mesa-vulkan-drivers libvulkan1 vulkan-tools imagemagick xvfb x11-utils libxkbcommon-x11-0 libx11-xcb1
      - run: cargo build --release -p hrc-rustgame
      - name: Headless render to PNG
        run: |
          mkdir -p ci-out
          ./target/release/horizon-rust-game --screenshot ci-out/rustgame.png --size 1280x720 --user Tester 2>&1 | tee ci-out/rustgame.log
          grep -q "Saved screenshot" ci-out/rustgame.log
          colors=$(convert ci-out/rustgame.png -format %k info:)
          echo "unique colors: $colors"
          [ "$colors" -ge 200 ] || { echo "FAIL screenshot looks empty"; exit 1; }
          echo "PASS headless render has content"
      - name: Window mode under Xvfb (stays alive, then screenshot)
        continue-on-error: true
        run: |
          Xvfb :98 -screen 0 1280x720x24 +extension GLX +render -noreset >/dev/null 2>&1 &
          sleep 3
          export DISPLAY=:98
          ./target/release/horizon-rust-game --dir ci-out/inst --user Tester > ci-out/rustgame-window.log 2>&1 &
          GP=$!
          sleep 20
          kill -0 $GP && echo "PASS window mode alive after 20 s" || { echo "FAIL window mode exited"; cat ci-out/rustgame-window.log; exit 1; }
          import -window root ci-out/rustgame-window.png
          kill $GP; sleep 2
          cat ci-out/rustgame-window.log
          test -s ci-out/inst/horizon-rust-save.txt && echo "PASS save file written on exit" || echo "NOTE no save file (process was killed, not closed)"
      - name: Publish screenshot and log to branch ci-shots-rustgame
        if: always()
        run: |
          git config --global user.name "ci"
          git config --global user.email "ci@users.noreply.github.com"
          d=$(mktemp -d)
          cp ci-out/*.png ci-out/*.log "$d"/ 2>/dev/null || true
          cd "$d"
          git init -q -b shots
          git add -A
          git commit -q -m "rustgame shots ${{ github.sha }}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" shots:refs/heads/ci-shots-rustgame
