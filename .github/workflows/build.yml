name: Build & Test

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'وسم الإصدار لإنشاء Release (مثل v0.1.0). اتركه فارغاً لعدم الإنشاء'
        required: false
        default: ''

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Unit tests
        run: cargo test --workspace --all-targets

  windows-exe:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build CLI (release)
        run: cargo build --release -p hrc-cli
      - uses: actions/upload-artifact@v4
        with:
          name: hrc-cli-windows
          path: target/release/hrc-cli.exe

  release:
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.release_tag != '')
    needs: [windows-exe, install-smoke]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: hrc-cli-windows
      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.release_tag || github.ref_name }}
        run: |
          gh release create "$TAG" hrc-cli.exe \
            --repo "${{ github.repository }}" \
            --title "Horizon Rust Clean $TAG (تجريبي)" \
            --prerelease \
            --notes "نسخة تجريبية مبكرة: **أداة سطر أوامر فقط** (بدون واجهة رسومية).
          ✅ مُختبَر: اختبارات الوحدة، وتثبيت 1.8.9 / 1.12.2 / 1.16.5 / 1.20.1 مع SHA1.
          ⚠️ غير مُختبَر بعد: تشغيل اللعبة فعلياً (launch)، وتنزيل Java Runtime.
          الاستخدام: hrc-cli.exe list | install 1.8.9 | launch 1.8.9 Steve 2048
          التفاصيل في README.md و STATUS.md."

  # اختبار حقيقي: تثبيت الإصدار وبناء أمر التشغيل (بدون تشغيل اللعبة لأن السيرفر بلا شاشة)
  install-smoke:
    needs: test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        version: ["1.8.9", "1.12.2", "1.16.5", "1.20.1"]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo run --release -p hrc-cli -- install ${{ matrix.version }}
